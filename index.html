<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatLOX AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #090d18;
      color: white;
      min-height: 100vh;
    }
    header {
      padding: 20px;
      border-bottom: 1px solid #20283b;
      font-size: 24px;
      font-weight: bold;
      color: #7c9cff;
    }

      max-width: 750px;

      background: #0b1220;

      margin-top: 12px;
      padding: 15px;
      background: #6485ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }
    #reply {
      margin-top: 20px;
      padding: 15px;
      background: #0b1220;
      border-radius: 10px;
      text-align: left;
      white-space: pre-wrap;
      display: none;
    }
    footer {
      text-align: center;
      color: #69758d;
      padding: 30px;
    }
  </style>
</head>
